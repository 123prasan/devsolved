<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DevSolved | Ultra Clean Header</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            /* Minimalist Dark Palette */
            --bg-base: #000000;
            --bg-nav: rgba(0, 0, 0, 0.6);
            --bg-surface: #0A0A0C;
            --bg-hover: rgba(255, 255, 255, 0.06);
            
            --border-faint: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            
            /* Typography */
            --text-primary: #FFFFFF;
            --text-secondary: #A1A1AA;
            --text-muted: #52525B;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            min-height: 200vh; /* For scroll demo */
            overflow-x: hidden;
        }

        /* --- Ultra Clean Header --- */
        .header {
            position: sticky; top: 0; width: 100%;
            background: var(--bg-nav);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border-faint);
            z-index: 1000;
        }

        .header-inner {
            max-width: 1200px; margin: 0 auto; height: 60px; padding: 0 24px;
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
        }

        /* --- Left: Brand --- */
        .header-left { justify-self: start; display: flex; align-items: center; }

        .brand {
            display: flex; align-items: center; gap: 10px;
            font-size: 15px; font-weight: 600; letter-spacing: -0.3px;
            color: var(--text-primary); text-decoration: none; transition: opacity 0.2s;
        }
        .brand:hover { opacity: 0.8; }
        
        .brand-icon {
            background: var(--text-primary); color: var(--bg-base);
            width: 24px; height: 24px; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
        }

        /* --- Center: Navigation --- */
        .header-center { justify-self: center; display: flex; align-items: center; gap: 32px; }

        .nav-link {
            color: var(--text-secondary); text-decoration: none;
            font-size: 14px; font-weight: 500; transition: color 0.2s ease;
        }
        .nav-link:hover { color: var(--text-primary); }
        .nav-link.active { color: var(--text-primary); }

        /* --- Right: Actions --- */
        .header-right { justify-self: end; display: flex; align-items: center; gap: 20px; }

        .search-pill {
            display: flex; align-items: center; gap: 12px;
            background: var(--bg-hover); border: 1px solid transparent;
            padding: 6px 12px; border-radius: 99px; cursor: pointer;
            color: var(--text-secondary); transition: all 0.2s;
        }
        .search-pill:hover { border-color: var(--border-hover); color: var(--text-primary); }
        .search-text { font-size: 13px; font-weight: 500; }
        .search-kbd {
            font-family: 'JetBrains Mono', monospace; font-size: 10px;
            background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 4px;
            color: var(--text-muted); border: 1px solid var(--border-faint);
        }

        .btn-write {
            background: var(--text-primary); color: var(--bg-base); border: none;
            padding: 6px 14px; border-radius: 99px; font-size: 13px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; gap: 6px; 
            text-decoration: none; transition: opacity 0.2s;
        }
        .btn-write:hover { opacity: 0.9; }

        /* Clean Avatar Dropdown */
        .user-menu-wrapper { position: relative; display: flex; align-items: center; }
        .avatar-btn {
            width: 30px; height: 30px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, #10B981 0%, #3B82F6 100%); 
            cursor: pointer; transition: transform 0.2s; padding: 0; outline: none;
        }
        .avatar-btn:hover { transform: scale(1.05); }
        
        .dropdown-menu {
            position: absolute; top: calc(100% + 16px); right: 0;
            background: rgba(10, 10, 12, 0.9); backdrop-filter: blur(16px);
            border: 1px solid var(--border-faint); border-radius: 12px; width: 220px; padding: 8px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6);
            opacity: 0; pointer-events: none; transform: translateY(-8px);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .dropdown-menu.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
        
        .dropdown-header { padding: 8px 12px 12px; border-bottom: 1px solid var(--border-faint); margin-bottom: 8px; }
        .dropdown-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
        .dropdown-email { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
        
        .dropdown-item {
            display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 12px;
            background: transparent; border: none; border-radius: 6px;
            color: var(--text-secondary); font-size: 13px; font-weight: 500;
            cursor: pointer; transition: all 0.2s; text-align: left; text-decoration: none;
        }
        .dropdown-item i-lucide { width: 16px; height: 16px; }
        .dropdown-item:hover { background: var(--bg-hover); color: var(--text-primary); }

        /* Mobile Hamburger */
        .mobile-menu-toggle {
            display: none; background: transparent; border: none;
            color: var(--text-secondary); cursor: pointer; padding: 4px;
            transition: color 0.2s;
        }
        .mobile-menu-toggle:hover { color: var(--text-primary); }

        /* --- Full Screen Mobile Menu --- */
        .mobile-menu {
            position: fixed; inset: 0; top: 60px; /* Below header */
            background: var(--bg-base); z-index: 990; padding: 24px;
            display: flex; flex-direction: column;
            opacity: 0; pointer-events: none; transform: translateY(10px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .mobile-menu.show { opacity: 1; pointer-events: auto; transform: translateY(0); }

        /* Scrollable container for links to prevent cutting off on tiny screens */
        .mobile-menu-scroll {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column;
            gap: 32px; padding-bottom: 24px;
            scrollbar-width: none;
        }
        .mobile-menu-scroll::-webkit-scrollbar { display: none; }
        
        .mobile-section { display: flex; flex-direction: column; }
        .mobile-section-title {
            font-size: 11px; font-weight: 600; text-transform: uppercase;
            color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 12px; padding-left: 12px;
        }
        
        .mobile-nav { display: flex; flex-direction: column; gap: 4px; }
        .mobile-nav-link {
            display: flex; align-items: center; gap: 14px;
            font-size: 16px; font-weight: 500; color: var(--text-secondary);
            padding: 12px; border-radius: 12px; text-decoration: none;
            transition: all 0.2s;
        }
        .mobile-nav-link i-lucide { width: 20px; color: var(--text-muted); transition: color 0.2s; }
        
        .mobile-nav-link:hover, .mobile-nav-link.active { color: var(--text-primary); background: var(--bg-hover); }
        .mobile-nav-link:hover i-lucide, .mobile-nav-link.active i-lucide { color: var(--text-primary); }

        /* Bottom Fixed Actions (Profile & Write) */
        .mobile-actions {
            display: flex; flex-direction: column; gap: 16px;
            padding-top: 24px; border-top: 1px solid var(--border-faint); margin-top: auto;
        }
        
        .mobile-profile { display: flex; align-items: center; justify-content: space-between; }
        .mobile-profile-left { display: flex; align-items: center; gap: 12px; }
        .mobile-profile-info { display: flex; flex-direction: column; }
        .mobile-profile-name { font-size: 15px; font-weight: 600; color: var(--text-primary); }
        .mobile-profile-email { font-size: 12px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
        
        .mobile-logout-btn {
            background: transparent; border: 1px solid var(--border-faint);
            color: var(--text-secondary); padding: 8px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;
        }
        .mobile-logout-btn:hover { background: rgba(239, 68, 68, 0.1); color: #EF4444; border-color: rgba(239, 68, 68, 0.2); }

        /* --- Strict Responsiveness --- */
        @media (max-width: 960px) {
            .header-inner { display: flex; justify-content: space-between; }
            .header-center { display: none; }
        }

        @media (max-width: 768px) {
            .header-inner { padding: 0 20px; }
            .header-right { gap: 0; }
            .search-pill, .btn-write, .user-menu-wrapper { display: none; }
            .mobile-menu-toggle { display: block; }
        }
    </style>
</head>
<body>

    <!-- Ultra Clean Header -->
    <header class="header">
        <div class="header-inner">
            
            <!-- Left: Brand -->
            <div class="header-left">
                <a href="#" class="brand">
                    <div class="brand-icon"><i data-lucide="terminal" style="width: 14px;"></i></div>
                    DevSolved
                </a>
            </div>

            <!-- Center: Links (Desktop Only) -->
            <nav class="header-center">
                <a href="#" class="nav-link active">Feed</a>
                <a href="#" class="nav-link">Incidents</a>
                <a href="#" class="nav-link">Tags</a>
                <a href="#" class="nav-link">Leaderboard</a>
            </nav>

            <!-- Right: Actions (Desktop/Tablet Only) -->
            <div class="header-right">
                <div class="search-pill">
                    <i data-lucide="search" style="width: 14px;"></i>
                    <span class="search-text">Search...</span>
                    <span class="search-kbd">⌘K</span>
                </div>

                <a href="creator.html" class="btn-write">
                    <i data-lucide="pen-line" style="width: 14px;"></i> Write
                </a>

                <div class="user-menu-wrapper">
                    <button class="avatar-btn" id="avatarBtn"></button>
                    
                    <div class="dropdown-menu" id="userMenu">
                        <div class="dropdown-header">
                            <div class="dropdown-name">Prasanna</div>
                            <div class="dropdown-email">prasanna@devsolved.com</div>
                        </div>
                        <a href="#" class="dropdown-item"><i data-lucide="user"></i> Profile</a>
                        <a href="#" class="dropdown-item"><i data-lucide="bookmark"></i> Saved</a>
                        <a href="#" class="dropdown-item"><i data-lucide="settings"></i> Settings</a>
                        <div style="height: 1px; background: var(--border-faint); margin: 6px 0;"></div>
                        <button class="dropdown-item" style="color: var(--text-secondary);"><i data-lucide="log-out"></i> Log out</button>
                    </div>
                </div>

                <!-- Mobile Only: Hamburger Toggle -->
                <button class="mobile-menu-toggle" id="mobileToggle">
                    <i data-lucide="menu" style="width: 24px;" id="menuIcon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Multi-Section Mobile Menu -->
    <div class="mobile-menu" id="mobileMenu">
        
        <!-- Scrollable Links Area -->
        <div class="mobile-menu-scroll">
            
            <!-- Section 1 -->
            <div class="mobile-section">
                <span class="mobile-section-title">Explore</span>
                <nav class="mobile-nav">
                    <a href="#" class="mobile-nav-link active"><i data-lucide="layout-grid"></i> Feed</a>
                    <a href="#" class="mobile-nav-link"><i data-lucide="book-open"></i> Incidents</a>
                    <a href="#" class="mobile-nav-link"><i data-lucide="hash"></i> Tags</a>
                    <a href="#" class="mobile-nav-link"><i data-lucide="trophy"></i> Leaderboard</a>
                </nav>
            </div>

            <!-- Section 2 -->
            <div class="mobile-section">
                <span class="mobile-section-title">Workspace</span>
                <nav class="mobile-nav">
                    <a href="#" class="mobile-nav-link"><i data-lucide="bookmark"></i> Saved Items</a>
                    <a href="#" class="mobile-nav-link"><i data-lucide="file-edit"></i> Drafts</a>
                    <a href="#" class="mobile-nav-link"><i data-lucide="settings"></i> Settings</a>
                </nav>
            </div>

            <!-- Section 3 -->
            <div class="mobile-section">
                <span class="mobile-section-title">Resources</span>
                <nav class="mobile-nav">
                    <a href="#" class="mobile-nav-link"><i data-lucide="book"></i> Documentation</a>
                    <a href="#" class="mobile-nav-link"><i data-lucide="life-buoy"></i> Support</a>
                </nav>
            </div>

        </div>

        <!-- Fixed Bottom Actions -->
        <div class="mobile-actions">
            <div class="mobile-profile">
                <div class="mobile-profile-left">
                    <div class="avatar-btn" style="width: 40px; height: 40px;"></div>
                    <div class="mobile-profile-info">
                        <span class="mobile-profile-name">Prasanna</span>
                        <span class="mobile-profile-email">prasanna@devsolved.com</span>
                    </div>
                </div>
                <button class="mobile-logout-btn" aria-label="Log Out">
                    <i data-lucide="log-out" style="width: 18px;"></i>
                </button>
            </div>
            
            <a href="creator.html" class="btn-write" style="width: 100%; justify-content: center; padding: 14px; font-size: 15px;">
                <i data-lucide="pen-line" style="width: 16px;"></i> Write an Incident
            </a>
        </div>

    </div>

    <!-- Scripts -->
    <script>
        lucide.createIcons();

        // Desktop User Dropdown Logic
        const avatarBtn = document.getElementById('avatarBtn');
        const userMenu = document.getElementById('userMenu');

        avatarBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            userMenu.classList.toggle('show');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (userMenu.classList.contains('show') && !userMenu.contains(e.target)) {
                userMenu.classList.remove('show');
            }
        });

        // Mobile Full Screen Menu Logic
        const mobileToggle = document.getElementById('mobileToggle');
        const mobileMenu = document.getElementById('mobileMenu');
        const menuIcon = document.getElementById('menuIcon');
        let isMenuOpen = false;

        mobileToggle.addEventListener('click', () => {
            isMenuOpen = !isMenuOpen;
            
            if (isMenuOpen) {
                mobileMenu.classList.add('show');
                menuIcon.setAttribute('data-lucide', 'x');
                document.body.style.overflow = 'hidden'; 
            } else {
                mobileMenu.classList.remove('show');
                menuIcon.setAttribute('data-lucide', 'menu');
                document.body.style.overflow = ''; 
            }
            lucide.createIcons({ nameAttr: 'data-lucide', attrs: { class: 'lucide' } });
        });
    </script>
</body>
</html>
